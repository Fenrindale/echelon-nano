name: echelon-nano
x-role: &role
  image: echelon-nano:local
  profiles: [verify]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  networks: [roles]
  environment:
    ECHELON_CORE_URL: http://core:8080
  pids_limit: 64
  mem_limit: 192m

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: echelon
      POSTGRES_DB: echelon
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U echelon -d echelon"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 384m

  vault-permissions:
    image: hashicorp/vault:1.20.4
    user: '0:0'
    entrypoint: [/bin/sh, -c]
    command: ['chmod 0700 /vault/data && chown vault:vault /vault/data']
    volumes: [vault-data:/vault/data]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]

  vault:
    image: hashicorp/vault:1.20.4
    user: vault
    environment:
      SKIP_CHOWN: 'true'
      SKIP_SETCAP: 'true'
    depends_on:
      vault-permissions:
        condition: service_completed_successfully
    command: [server]
    volumes:
      - vault-data:/vault/data
      - ./deploy/vault.hcl:/vault/config/echelon.hcl:ro
    networks: [secrets]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

  bootstrap:
    image: echelon-nano:local
    build:
      context: .
      target: runtime
    profiles: [tools]
    command: [bootstrap]
    volumes: [./.runtime/bootstrap:/bootstrap]
    networks: [secrets]
    environment:
      VAULT_ADDR: http://vault:8200
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  core:
    image: echelon-nano:local
    build:
      context: .
      target: runtime
    ports: ["127.0.0.1:18431:8080"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /run/secrets/vault-core-token
      ECHELON_CALLBACK_URI: http://127.0.0.1:18431/auth/callback
    secrets: [postgres-password, vault-core-token, worker-token]
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
      mcp-host:
        condition: service_started
    networks: [roles, data, secrets, provider, tools]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 512m

  worker:
    image: echelon-nano-worker:local
    build:
      context: .
      target: worker
    command: [worker]
    user: '0:0'
    volumes: [./.runtime/bootstrap/worker-token:/root/.broker/token:ro]
    networks: [tools]
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/jobs:rw,nosuid,nodev,size=32m,mode=0755"]
    pids_limit: 64
    mem_limit: 320m
    cpus: 1.0

  fixture:
    image: echelon-nano-worker:local
    profiles: [verify-api]
    entrypoint: [/usr/bin/python3, /fixture/api.py]
    command: []
    user: '10003:10003'
    volumes: [./scripts/fixtures/api.py:/fixture/api.py:ro]
    networks: [tools]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 64m

  mcp-host:
    image: echelon-nano-mcp:local
    build:
      context: .
      target: mcp-host
    user: '0:0'
    volumes:
      - ./.runtime/bootstrap/worker-token:/root/.broker/token:ro
      - mcp-packages:/packages
    networks: [tools, provider]
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
    pids_limit: 160
    mem_limit: 768m
    cpus: 2.0

  analyst:
    <<: *role
    command: [role-probe, --role, analyst]
    volumes: [./.runtime/roles/analyst:/run/secrets/role-token:ro]
  handler:
    <<: *role
    command: [role-probe, --role, handler]
    volumes: [./.runtime/roles/handler:/run/secrets/role-token:ro]
  agent:
    <<: *role
    command: [role-probe, --role, agent]
    volumes: [./.runtime/roles/agent:/run/secrets/role-token:ro]
  master:
    <<: *role
    command: [role-probe, --role, master]
    volumes: [./.runtime/roles/master:/run/secrets/role-token:ro]

networks:
  roles:
    internal: true
  data:
    internal: true
  secrets:
    internal: true
  provider: {}
  tools:
    internal: true

volumes:
  mcp-packages: {}
  postgres-data: {}
  vault-data: {}

secrets:
  postgres-password:
    file: ./.runtime/bootstrap/postgres-password
  vault-core-token:
    file: ./.runtime/bootstrap/vault-core-token
  worker-token:
    file: ./.runtime/bootstrap/worker-token
